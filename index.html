<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>旸与雪</title>

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #e8f0e4;
      color: #1f2b1d;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #dce8d6;
    }

    .header {
      height: 78px;
      background: #f0f5ec;
      border-bottom: 1px solid #c8d8c0;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      flex-shrink: 0;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #6bae56;
      background: #fff;
    }

    .header-text {
      margin-left: 12px;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .status {
      margin-top: 6px;
      font-size: 18px;
      color: #7b8d72;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #dce8d6;
    }

    .msg {
      max-width: 78%;
      margin: 10px 0;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .user {
      margin-left: auto;
      background: #95d475;
      color: #1a1a1a;
      border-top-right-radius: 4px;
    }

    .assistant {
      margin-right: auto;
      background: #ffffff;
      color: #1a1a1a;
      border-top-left-radius: 4px;
    }

    .input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px;
      background: #f0f5ec;
      border-top: 1px solid #c8d8c0;
    }

    #input {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      resize: none;
      border: 1px solid #aacb9b;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 16px;
      line-height: 1.4;
      outline: none;
      background: #f8fbf5;
      font-family: inherit;
    }

    #sendBtn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: #6bae56;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sendBtn:disabled {
      background: #b8ccb0;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <img class="avatar" src="apple-touch-icon.png" alt="avatar" />
      <div class="header-text">
        <div class="name">旸</div>
        <div class="status">Opus 4.6</div>
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-bar">
      <textarea id="input" placeholder="..." rows="1"></textarea>
      <button id="sendBtn" type="button">➤</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://yang-chat-backend.onrender.com/chat";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage("user", text);

      input.value = "";
      input.style.height = "42px";
      sendBtn.disabled = true;

      const loading = addMessage("assistant", "正在回复...");

      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await res.json();

        if (data.reply) {
          loading.textContent = data.reply;
        } else if (data.error) {
          loading.textContent = "出错了：" + JSON.stringify(data.error);
        } else {
          loading.textContent = "出错了：没有收到回复";
        }

      } catch (err) {
        loading.textContent = "连接失败：" + err.message;
      }

      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener("input", function() {
      input.style.height = "42px";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
  </script>
</body>
</html>
