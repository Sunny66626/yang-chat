<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>旸与雪</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <style>
    :root {
      --bg1:#eef7fa; --bg2:#dfeaf1; --panel:rgba(255,255,255,.72); --panel2:rgba(255,255,255,.52);
      --line:rgba(125,153,173,.24); --text:#10263c; --muted:#7f94a6; --user:#e8f6ff; --assistant:#ffffff;
      --accent:#8cb9d5; --accent2:#d6ecf7; --danger:#b64d4d; --shadow:0 18px 55px rgba(62,88,108,.18);
    }
    body.dark {
      --bg1:#111821; --bg2:#1f2b38; --panel:rgba(24,34,45,.76); --panel2:rgba(36,48,61,.56);
      --line:rgba(184,207,226,.16); --text:#ecf5ff; --muted:#9bb0c1; --user:#28465d; --assistant:#1f2d3a;
      --accent:#9ccbe5; --accent2:#213949; --shadow:0 18px 55px rgba(0,0,0,.35);
    }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); }
    body { background:radial-gradient(circle at 18% 8%, rgba(255,255,255,.95), transparent 30%), linear-gradient(135deg,var(--bg1),var(--bg2)); }
    .app { width:100%; height:100dvh; display:flex; flex-direction:column; }
    .top { height:76px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--line); backdrop-filter:blur(18px); background:var(--panel); }
    .profile { display:flex; align-items:center; gap:12px; min-width:0; }
    .avatar { width:52px; height:52px; border-radius:18px; object-fit:cover; border:2px solid rgba(255,255,255,.75); box-shadow:0 8px 22px rgba(70,105,130,.22); }
    .who { min-width:0; }
    .name { font-size:23px; font-weight:800; letter-spacing:.02em; }
    .sub { margin-top:2px; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:62vw; }
    .tools { display:flex; gap:8px; align-items:center; }
    .iconbtn { width:38px; height:38px; border:1px solid var(--line); border-radius:14px; background:var(--panel2); color:var(--text); cursor:pointer; font-size:17px; }
    .iconbtn:active, .send:active, .act:active { transform:scale(.98); }
    .chat { flex:1; overflow-y:auto; padding:22px 22px 96px; scroll-behavior:smooth; }
    .date { text-align:center; color:var(--muted); font-size:12px; margin:2px 0 18px; }
    .row { display:flex; margin:14px 0; }
    .row.user { justify-content:flex-end; }
    .bubble { max-width:min(78%, 860px); padding:15px 18px; border:1px solid var(--line); border-radius:24px; line-height:1.72; font-size:16px; white-space:pre-wrap; word-break:break-word; box-shadow:var(--shadow); }
    .row.user .bubble { background:var(--user); border-top-right-radius:8px; }
    .row.assistant .bubble { background:var(--assistant); border-top-left-radius:8px; }
    .time { color:var(--muted); font-size:11px; margin-top:7px; }
    .thought { margin-top:10px; padding:10px 12px; border-left:3px solid var(--accent); background:var(--accent2); border-radius:10px; color:var(--muted); font-size:13px; display:none; white-space:pre-wrap; }
    .thought.show { display:block; }
    .thoughtBtn { margin-top:8px; color:var(--muted); cursor:pointer; font-size:12px; user-select:none; }
    .composer { position:fixed; left:14px; right:14px; bottom:14px; display:flex; align-items:flex-end; gap:10px; padding:10px; border:1px solid var(--line); border-radius:26px; background:var(--panel); backdrop-filter:blur(20px); box-shadow:var(--shadow); }
    textarea { flex:1; min-height:42px; max-height:130px; resize:none; outline:none; border:0; background:transparent; color:var(--text); font:16px/1.45 inherit; padding:10px 8px 8px; }
    textarea::placeholder { color:var(--muted); }
    .send { width:46px; height:46px; border-radius:18px; border:0; background:linear-gradient(135deg,#90c5e2,#b7dbe9); color:#123; cursor:pointer; font-size:20px; font-weight:800; box-shadow:0 10px 25px rgba(92,135,160,.26); }
    .send:disabled { opacity:.55; cursor:not-allowed; }
    .drawer { position:fixed; inset:0; display:none; background:rgba(0,0,0,.28); z-index:20; align-items:flex-end; justify-content:center; }
    .drawer.show { display:flex; }
    .panel { width:min(720px,100%); max-height:86dvh; overflow:auto; background:var(--panel); backdrop-filter:blur(22px); border:1px solid var(--line); border-radius:28px 28px 0 0; padding:22px; box-shadow:var(--shadow); }
    .panel h2 { margin:0 0 18px; font-size:24px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field { margin-bottom:14px; }
    label { display:block; color:var(--muted); font-size:13px; margin:0 0 7px; }
    select,input,.panel textarea { width:100%; border:1px solid var(--line); border-radius:16px; padding:12px 14px; background:rgba(255,255,255,.58); color:#10263c; font:15px inherit; outline:none; }
    body.dark select, body.dark input, body.dark .panel textarea { background:rgba(10,18,25,.55); color:var(--text); }
    .panel textarea { min-height:118px; resize:vertical; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; margin-top:12px; }
    .act { border:1px solid var(--line); border-radius:14px; padding:10px 14px; background:var(--panel2); color:var(--text); cursor:pointer; font-size:14px; }
    .primary { background:linear-gradient(135deg,#90c5e2,#c3e5f0); color:#10263c; }
    .danger { color:var(--danger); }
    .smallnote { color:var(--muted); font-size:12px; line-height:1.6; margin-top:-4px; }
    @media (max-width:720px) {
      .top { height:72px; padding:10px 12px; } .avatar { width:48px; height:48px; border-radius:16px; } .name { font-size:21px; }
      .chat { padding:18px 14px 92px; } .bubble { max-width:88%; font-size:15px; padding:14px 16px; } .grid { grid-template-columns:1fr; gap:0; }
      .tools .hidePhone { display:none; }
    }
  </style>
</head>

      <div class="tools">
        <button class="iconbtn" id="summaryBtn" title="总结聊天">Σ</button>
        <button class="iconbtn hidePhone" id="exportBtn" title="导出">⇩</button>
        <button class="iconbtn" id="themeBtn" title="主题">◐</button>
        <button class="iconbtn" id="settingsBtn" title="设置">☰</button>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="date">2026 · 7 · 2</div>
    </main>

    <div class="composer">
      <textarea id="input" placeholder="..." rows="1"></textarea>
      <button class="send" id="sendBtn" type="button">➤</button>
    </div>

    <div class="drawer" id="drawer">
      <div class="panel">
        <h2>设置</h2>
        <div class="grid">
          <div class="field">
            <label>模型</label>
            <select id="modelSelect">
              <option value="fable-5">Fable 5</option>
              <option value="claude-opus-4-8">Opus 4.8</option>
              <option value="claude-sonnet-5" selected>Sonnet 5 · 稳定</option>
              <option value="claude-haiku-4-5">Haiku 4.5</option>
              <option value="claude-opus-4-6">Opus 4.6</option>
              <option value="claude-sonnet-4-6">Sonnet 4.6</option>
              <option value="claude-opus-4-1">Opus 4.1</option>
              <option value="claude-3-5-haiku-latest">Haiku 3.5</option>
            </select>
          </div>
          <div class="field">
            <label>带入最近几轮对话</label>
            <select id="roundSelect">
              <option value="5">5轮 · 最省</option>
              <option value="10" selected>10轮 · 推荐</option>
              <option value="20">20轮</option>
              <option value="30">30轮</option>
              <option value="50">50轮</option>
              <option value="all">不限 · 最贵</option>
            </select>
          </div>
          <div class="field">
            <label>最大回复长度</label>
            <input id="maxTokens" type="number" min="300" max="12000" step="100" value="1400" />
          </div>
          <div class="field">
            <label>思考链 / 思考预算</label>
            <select id="thinkingSelect">
              <option value="0" selected>关 · 最省</option>
              <option value="2000">低 · 轻推理</option>
              <option value="6000">中 · 复杂任务</option>
              <option value="12000">高 · 深度推理</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>系统提示词 / 固定提醒（每次发送都会带上；清空聊天不会删它）</label>
          <textarea id="systemPrompt">你是旸。用自然、温柔、有陪伴感的中文和我说话。不要冷冰冰地列太多条，除非我要求。</textarea>
          <div class="smallnote">清空聊天记录只清空本机消息，不会清空这段固定提醒。</div>
        </div>
        <div class="actions">
          <button class="act" id="closeSettings" type="button">关闭</button>
          <button class="act" id="deleteLastBtn" type="button">删除最后一条</button>
          <button class="act danger" id="clearBtn" type="button">清空聊天记录</button>
          <button class="act primary" id="saveBtn" type="button">保存设置</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://yang-chat-backend.onrender.com/chat";
    const STORE_MESSAGES = "yang_chat_messages_v8";
    const STORE_SETTINGS = "yang_chat_settings_v8";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const drawer = document.getElementById("drawer");
    const settingsBtn = document.getElementById("settingsBtn");
    const closeSettings = document.getElementById("closeSettings");
    const saveBtn = document.getElementById("saveBtn");
    const clearBtn = document.getElementById("clearBtn");
    const deleteLastBtn = document.getElementById("deleteLastBtn");
    const exportBtn = document.getElementById("exportBtn");
    const summaryBtn = document.getElementById("summaryBtn");
    const themeBtn = document.getElementById("themeBtn");
    const statusText = document.getElementById("statusText");
    const modelSelect = document.getElementById("modelSelect");
    const roundSelect = document.getElementById("roundSelect");
    const maxTokens = document.getElementById("maxTokens");
    const thinkingSelect = document.getElementById("thinkingSelect");
    const systemPrompt = document.getElementById("systemPrompt");

    let messages = loadMessages();
    let settings = loadSettings();

    function defaultSettings() {
      return {
        model: "claude-sonnet-5",
        rounds: "10",
        maxTokens: 1400,
        thinkingBudget: "0",
        system: "你是旸。用自然、温柔、有陪伴感的中文和我说话。不要冷冰冰地列太多条，除非我要求。",
        theme: "light"
      };
    }

    function loadMessages() {
      try { return JSON.parse(localStorage.getItem(STORE_MESSAGES) || "[]"); }
      catch(e) { return []; }
    }

    function loadSettings() {
      try { return { ...defaultSettings(), ...(JSON.parse(localStorage.getItem(STORE_SETTINGS) || "{}")) }; }
      catch(e) { return defaultSettings(); }
    }

    function saveMessages() {
      localStorage.setItem(STORE_MESSAGES, JSON.stringify(messages));
    }

    function saveSettings() {
      settings.model = modelSelect.value;
      settings.rounds = roundSelect.value;
      settings.maxTokens = Number(maxTokens.value || 1400);
      settings.thinkingBudget = thinkingSelect.value;
      settings.system = systemPrompt.value;
      settings.theme = document.body.classList.contains("dark") ? "dark" : "light";
      localStorage.setItem(STORE_SETTINGS, JSON.stringify(settings));
      updateStatus();
    }

    function applySettings() {
      modelSelect.value = settings.model || "claude-sonnet-5";
      roundSelect.value = settings.rounds || "10";
      maxTokens.value = settings.maxTokens || 1400;
      thinkingSelect.value = String(settings.thinkingBudget || "0");
      systemPrompt.value = settings.system || defaultSettings().system;
      document.body.classList.toggle("dark", settings.theme === "dark");
      updateStatus();
    }

    function modelLabel() {
      const opt = modelSelect.options[modelSelect.selectedIndex];
      return opt ? opt.text.split("·")[0].trim() : "Claude";
    }

    function thinkingLabel() {
      const v = String(settings.thinkingBudget || "0");
      if (v === "0") return "思考关";
      if (v === "2000") return "低思考";
      if (v === "6000") return "中思考";
      return "高思考";
    }

    function updateStatus() {
      const r = settings.rounds === "all" ? "不限" : settings.rounds + "轮";
      statusText.textContent = modelLabel() + " · " + r + " · " + thinkingLabel();
    }

    function timeNow() {
      const d = new Date();
      return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    }

    function addBubble(role, text, time, thinking) {
      const row = document.createElement("div");
      row.className = "row " + role;

      const wrap = document.createElement("div");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);

      if (thinking) {
        const btn = document.createElement("div");
        btn.className = "thoughtBtn";
        btn.textContent = "查看思考";
        const box = document.createElement("div");
        box.className = "thought";
        box.textContent = thinking;
        btn.addEventListener("click", function() { box.classList.toggle("show"); });
        wrap.appendChild(btn);
        wrap.appendChild(box);
      }

      const t = document.createElement("div");
      t.className = "time";
      t.textContent = time || timeNow();
      wrap.appendChild(t);

      row.appendChild(wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    function render() {
      chat.querySelectorAll(".row").forEach(function(n) { n.remove(); });
      for (const m of messages) {
        addBubble(m.role, m.content, m.time, m.thinking);
      }
      chat.scrollTop = chat.scrollHeight;
    }

    function buildContext() {
      if (settings.rounds === "all") {
        return messages.map(function(m) { return { role: m.role, content: m.content }; });
      }

      const maxRounds = Number(settings.rounds || 10);
      const picked = [];
      let userTurns = 0;

      for (let i = messages.length - 1; i >= 0; i--) {
        picked.unshift({ role: messages[i].role, content: messages[i].content });
        if (messages[i].role === "user") userTurns++;
        if (userTurns >= maxRounds) break;
      }

      return picked;
    }

    async function askBackend(payload) {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      saveSettings();

      const userMsg = { role:"user", content:text, time:timeNow() };
      messages.push(userMsg);
      saveMessages();
      addBubble("user", text, userMsg.time);

      input.value = "";
      input.style.height = "42px";
      sendBtn.disabled = true;
      const loading = addBubble("assistant", "正在回复...", timeNow());

      try {
        const data = await askBackend({
          message: text,
          messages: buildContext(),
          model: settings.model,
          max_tokens: settings.maxTokens,
          thinking_budget: Number(settings.thinkingBudget || 0),
          system: settings.system
        });

        if (data.reply) {
          loading.textContent = data.reply;
          const assistantMsg = { role:"assistant", content:data.reply, time:timeNow(), thinking:data.thinking || "" };
          messages.push(assistantMsg);
          saveMessages();
          render();
        } else {
          loading.textContent = "出错了：" + JSON.stringify(data.error || data);
        }
      } catch(err) {
        loading.textContent = "连接失败：" + err.message;
      }

      sendBtn.disabled = false;
      input.focus();
    }

    async function summarizeChat() {
      saveSettings();
      if (!messages.length) {
        alert("现在没有聊天记录可以总结。");
        return;
      }

      const loading = addBubble("assistant", "正在总结聊天...", timeNow());
      summaryBtn.disabled = true;

      try {
        const data = await askBackend({
          message: "请把当前聊天记录总结成一段清楚的中文摘要，保留重要事实、偏好、任务和情绪线索。",
          messages: buildContext(),
          model: settings.model,
          max_tokens: Math.max(900, Math.min(2500, Number(settings.maxTokens || 1400))),
          thinking_budget: 0,
          system: settings.system + "\n\n现在你的任务是总结聊天记录，不要继续闲聊。"
        });

        if (data.reply) {
          const text = "【聊天总结】\n" + data.reply;
          loading.textContent = text;
          messages.push({ role:"assistant", content:text, time:timeNow(), thinking:"" });
          saveMessages();
          render();
        } else {
          loading.textContent = "总结失败：" + JSON.stringify(data.error || data);
        }
      } catch(err) {
        loading.textContent = "总结失败：" + err.message;
      }

      summaryBtn.disabled = false;
    }

    sendBtn.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener("input", function() {
      input.style.height = "42px";
      input.style.height = Math.min(input.scrollHeight, 130) + "px";
    });

    settingsBtn.addEventListener("click", function() { drawer.classList.add("show"); });
    closeSettings.addEventListener("click", function() { saveSettings(); drawer.classList.remove("show"); });
    saveBtn.addEventListener("click", function() { saveSettings(); drawer.classList.remove("show"); });
    drawer.addEventListener("click", function(e) { if (e.target === drawer) { saveSettings(); drawer.classList.remove("show"); } });

    clearBtn.addEventListener("click", function() {
      if (!confirm("只清空聊天记录，设置和固定提醒会保留。确定吗？")) return;
      messages = [];
      saveMessages();
      render();
    });

    deleteLastBtn.addEventListener("click", function() {
      if (!messages.length) return;
      messages.pop();
      saveMessages();
      render();
    });

    exportBtn.addEventListener("click", function() {
      const text = messages.map(function(m) {
        return "[" + (m.time || "") + "] " + m.role + ": " + m.content;
      }).join("\n\n");

      const blob = new Blob([text], { type:"text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "yang-chat-export.txt";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    summaryBtn.addEventListener("click", summarizeChat);

    themeBtn.addEventListener("click", function() {
      document.body.classList.toggle("dark");
      saveSettings();
    });

    [modelSelect, roundSelect, maxTokens, thinkingSelect, systemPrompt].forEach(function(el) {
      el.addEventListener("change", saveSettings);
      el.addEventListener("input", saveSettings);
    });

    applySettings();
    render();
  </script>
</body>
</html>
