<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>旸与雪</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="apple-touch-icon.png" />
<style>
:root {
  --bg1:#f7fafc;
  --bg2:#e9f0f4;
  --ink:#253447;
  --soft:#6e7f8c;
  --faint:#9aa8b4;
  --line:rgba(96,120,145,.18);
  --glass:rgba(255,255,255,.56);
  --human:#dfe8ef;
  --ai:rgba(255,255,255,.82);
  --accent:#3b5268;
  --shadow:0 18px 48px rgba(53,75,96,.12);
  --radius:22px;
  --font-cn:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-serif:"Songti SC","STSong","Noto Serif SC",serif;
}
:root[data-theme="harbor"] {
  --bg1:#f4f2ef;
  --bg2:#e8e3df;
  --ink:#37424c;
  --soft:#667482;
  --faint:#9b9a99;
  --line:rgba(74,93,108,.20);
  --glass:rgba(255,255,255,.50);
  --human:#e1e0e3;
  --ai:rgba(255,255,255,.78);
  --accent:#4a5d6c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg1);font-family:var(--font-cn);color:var(--ink);}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(circle at 20% 12%,rgba(255,255,255,.95),transparent 28%),
  radial-gradient(circle at 82% 18%,rgba(188,208,224,.35),transparent 30%),
  radial-gradient(circle at 50% 100%,rgba(201,218,212,.38),transparent 42%),
  linear-gradient(180deg,var(--bg1),var(--bg2));z-index:0;}
body::after{content:"";position:fixed;inset:0;background-image:
  linear-gradient(rgba(255,255,255,.18) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.13) 1px, transparent 1px);
  background-size:42px 42px;opacity:.24;z-index:0;pointer-events:none;}
.app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;max-width:960px;margin:0 auto;left:0;right:0;}
.topbar{height:calc(70px + env(safe-area-inset-top));padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);background:rgba(247,250,252,.48);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
.avatar{position:absolute;left:18px;top:calc(10px + env(safe-area-inset-top));width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 8px 22px rgba(61,86,108,.16);object-fit:cover;background:#fff;}
.peer{text-align:center;line-height:1.15;padding:0 76px;}
.name{font-family:var(--font-serif);font-size:25px;font-weight:600;letter-spacing:.04em;}
.status{margin-top:5px;font-size:13px;color:var(--soft);}
.iconbtn{position:absolute;right:14px;top:calc(16px + env(safe-area-inset-top));width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--glass);color:var(--accent);font-size:18px;display:grid;place-items:center;box-shadow:0 8px 22px rgba(53,75,96,.08);}
.chat{flex:1;overflow-y:auto;padding:22px 16px calc(110px + env(safe-area-inset-bottom));scroll-behavior:smooth;}
.day{width:max-content;margin:4px auto 20px;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.38);color:var(--faint);font-size:12px;}
.msgrow{display:flex;margin:14px 0;}
.msgrow.user{justify-content:flex-end;}
.msgrow.assistant{justify-content:flex-start;}
.bubble{max-width:min(76%,680px);padding:12px 15px;border-radius:var(--radius);line-height:1.72;font-size:15.5px;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow);}
.user .bubble{background:var(--human);border-top-right-radius:8px;color:var(--ink);}
.assistant .bubble{background:var(--ai);border:1px solid rgba(255,255,255,.58);border-top-left-radius:8px;color:var(--ink);}
.meta{font-size:11px;color:var(--faint);margin-top:5px;padding:0 6px;}
.user .stack{display:flex;flex-direction:column;align-items:flex-end;}
.assistant .stack{display:flex;flex-direction:column;align-items:flex-start;}
.composer{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,960px);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,250,252,0),rgba(247,250,252,.85) 24%,rgba(247,250,252,.95));}
.form{display:flex;align-items:flex-end;gap:10px;padding:8px;border:1px solid var(--line);border-radius:30px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(53,75,96,.12);}
#input{flex:1;min-height:40px;max-height:132px;resize:none;border:0;outline:0;background:transparent;padding:9px 9px 9px 12px;font-size:16px;line-height:1.45;font-family:var(--font-cn);color:var(--ink);}
#input::placeholder{color:var(--faint)}
#sendBtn{width:42px;height:42px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 10px 24px rgba(54,78,100,.20);}
#sendBtn:disabled{opacity:.52;}
.panel{position:fixed;z-index:20;inset:0;background:rgba(35,49,64,.18);display:none;align-items:flex-end;}
.panel.show{display:flex;}
.sheet{width:100%;max-width:960px;margin:0 auto;background:rgba(248,250,252,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top-left-radius:26px;border-top-right-radius:26px;padding:22px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -24px 60px rgba(53,75,96,.16);}
.sheet h3{margin:0 0 15px;font-size:18px;}
.actions{display:grid;gap:10px;}
.action{height:46px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.65);color:var(--ink);font-size:15px;text-align:left;padding:0 14px;}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(37,52,71,.86);color:#fff;padding:9px 13px;border-radius:999px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:.2s;}
.toast.show{opacity:1;}
@media (max-width:560px){.bubble{max-width:82%;font-size:15px}.topbar{height:calc(64px + env(safe-area-inset-top));}.avatar{width:46px;height:46px}.name{font-size:23px}}
</style>
</head>

    <button class="iconbtn" id="menuBtn" type="button" aria-label="菜单">⋯</button>
  </div>
  <div class="chat" id="chat"><div class="day" id="day"></div></div>
  <div class="composer">
    <form class="form" id="form">
      <textarea id="input" rows="1" placeholder="Write a letter..." enterkeyhint="send"></textarea>
      <button id="sendBtn" type="submit" aria-label="发送">➤</button>
    </form>
  </div>
</div>
<div class="panel" id="panel">
  <div class="sheet">
    <h3>Channel</h3>
    <div class="actions">
      <button class="action" id="themeBtn" type="button">切换主题 Pearl / Harbor</button>
      <button class="action" id="clearBtn" type="button">清空本机聊天记录</button>
      <button class="action" id="closeBtn" type="button">关闭</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const BACKEND_URL = "https://yang-chat-backend.onrender.com/chat";
const STORE_KEY = "yang_chat_tidal_local_history_v1";
const THEME_KEY = "yang_chat_tidal_theme";
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusEl = document.getElementById("status");
const panel = document.getElementById("panel");
const toast = document.getElementById("toast");
let busy = false;

function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function showToast(text){
  toast.textContent = text; toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 1600);
}
function setDay(){
  const d = new Date();
  document.getElementById("day").textContent = d.getFullYear() + " · " + (d.getMonth()+1) + " · " + d.getDate();
}
function saveHistory(){
  const arr = Array.from(document.querySelectorAll(".msgrow")).map(row=>({role:row.dataset.role,text:row.querySelector(".bubble").textContent,time:row.dataset.time||""}));
  localStorage.setItem(STORE_KEY, JSON.stringify(arr.slice(-80)));
}
function addMessage(role, text, time){
  const row = document.createElement("div");
  row.className = "msgrow " + role;
  row.dataset.role = role;
  row.dataset.time = time || nowTime();
  const stack = document.createElement("div");
  stack.className = "stack";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = row.dataset.time;
  stack.appendChild(bubble);
  stack.appendChild(meta);
  row.appendChild(stack);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  saveHistory();
  return bubble;
}
function loadHistory(){
  try{
    const arr = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    arr.forEach(m=>addMessage(m.role || "assistant", m.text || "", m.time || nowTime()));
  }catch(e){}
}
async function askBackend(text){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 120000);
  try{
    const res = await fetch(BACKEND_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text}),
      signal:controller.signal
    });
    const data = await res.json().catch(()=>({error:"返回不是 JSON"}));
    if (!res.ok) throw new Error(JSON.stringify(data.error || data));
    if (data.reply) return data.reply;
    if (data.error) throw new Error(JSON.stringify(data.error));
    throw new Error("没有收到回复");
  } finally { clearTimeout(timer); }
}
async function sendMessage(){
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  busy = true;
  sendBtn.disabled = true;
  statusEl.textContent = "Opus 4.6 · thinking";
  addMessage("user", text);
  input.value = "";
  input.style.height = "40px";
  const loading = addMessage("assistant", "潮声正在回来……");
  try{
    const reply = await askBackend(text);
    loading.textContent = reply;
    saveHistory();
  }catch(err){
    loading.textContent = "连接失败：" + err.message;
    saveHistory();
  }
  statusEl.textContent = "Opus 4.6 · online";
  sendBtn.disabled = false;
  busy = false;
  input.focus();
}
form.addEventListener("submit", (e)=>{ e.preventDefault(); sendMessage(); });
input.addEventListener("keydown", (e)=>{ if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
input.addEventListener("input", ()=>{ input.style.height="40px"; input.style.height=Math.min(input.scrollHeight,132)+"px"; });
document.getElementById("menuBtn").onclick = ()=>panel.classList.add("show");
document.getElementById("closeBtn").onclick = ()=>panel.classList.remove("show");
panel.addEventListener("click", e=>{ if(e.target===panel) panel.classList.remove("show"); });
document.getElementById("clearBtn").onclick = ()=>{
  localStorage.removeItem(STORE_KEY);
  Array.from(document.querySelectorAll(".msgrow")).forEach(n=>n.remove());
  panel.classList.remove("show"); showToast("已清空本机记录");
};
document.getElementById("themeBtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "harbor" ? "light" : "harbor";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(THEME_KEY, next);
};
(function init(){
  const t = localStorage.getItem(THEME_KEY) || "light";
  document.documentElement.setAttribute("data-theme", t);
  setDay(); loadHistory();
  input.focus();
})();
</script>
</body>
</html>
